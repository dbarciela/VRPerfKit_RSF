name: Build and Release

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cmake_arch: x64
            out_zip: vrperfkit-rsf-x64.zip
          - arch: x86
            cmake_arch: Win32
            out_zip: vrperfkit-rsf-x86.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure CMake
        run: >
          cmake -B build
          -S .
          -A ${{ matrix.cmake_arch }}
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Prepare distribution package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          $dll = (Get-ChildItem -Path build -Filter dxgi.dll -Recurse | Select-Object -First 1).FullName
          if (-not $dll) { throw "dxgi.dll was not found in build directory" }
          Copy-Item -Path $dll -Destination "dist\dxgi.dll"
          Copy-Item -Path "vrperfkit_RSF.yml" -Destination "dist\vrperfkit_RSF.yml"
          Copy-Item -Path "vrperfkit_RSF.yml" -Destination "dist\vrperfkit.yml"
          Copy-Item -Path "README.md" -Destination "dist\README.md"
          Copy-Item -Path "LICENSE" -Destination "dist\LICENSE"
          Compress-Archive -Path "dist\*" -DestinationPath "${{ matrix.out_zip }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out_zip }}
          path: ${{ matrix.out_zip }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Determine tag name
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v4.0.0-preview-$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          files: release-artifacts/*
          generate_release_notes: true
